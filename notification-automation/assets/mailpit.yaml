apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.4
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: notifications
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
    - name: http
      port: 8025
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: notifications
spec:
  ingressClassName: apisix
  rules:
    - host: mailpit.notifications.eoepca.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
